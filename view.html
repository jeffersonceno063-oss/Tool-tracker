<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <title>SGF Inventory System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #f4efe6; --paper: #fffdf8; --ink: #17160f; --muted: #6a655a; --line: #e6dfcf; --soft: #efe8d9; --field: #fbf8f1;
      --yellow: #f7d44c; --yellow-soft: #fff1b3;
      --ok: #23764a; --ok-bg: #e0f1e6; --warn-ink: #7a5000; --warn-bg: #fff0c2; --bad: #b3372a; --bad-bg: #fbe3df;
      --shadow: 0 1px 2px rgba(23,22,15,.05), 0 10px 28px rgba(23,22,15,.07);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 18px; line-height: 1.45;
           padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
    .wrap { max-width: 560px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 18px 2px 14px; }
    .mark { width: 42px; height: 42px; border-radius: 14px; background: var(--ink); color: var(--yellow); display: grid; place-items: center; font-weight: 800; font-size: 14px; flex: none; }
    .brand b { font-size: 17px; font-weight: 800; line-height: 1.15; display: block; }
    .brand span { font-size: 13px; color: var(--muted); font-weight: 500; }
    h2 { font-size: 30px; font-weight: 800; line-height: 1.12; margin: 2px 0 4px; letter-spacing: -.015em; word-break: break-word; }
    h3 { font-size: 20px; font-weight: 800; margin: 20px 0 8px; }
    .card { background: var(--paper); border-radius: 28px; padding: 22px 20px; box-shadow: var(--shadow); }
    .muted { color: var(--muted); font-size: 16px; }
    .badge { display: inline-block; padding: 7px 16px; border-radius: 999px; font-size: 16px; font-weight: 700; margin: 8px 0 12px; }
    .ok { background: var(--ok-bg); color: var(--ok); }
    .out { background: var(--bad-bg); color: var(--bad); }
    .low { background: var(--warn-bg); color: var(--warn-ink); }
    button, input, textarea { font: inherit; font-size: 20px; }
    input, textarea { width: 100%; padding: 15px 16px; margin: 8px 0; color: var(--ink); background: var(--field); border: 1.5px solid var(--line); border-radius: 18px; }
    input:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 4px var(--yellow-soft); }
    textarea { min-height: 130px; font-family: inherit; }
    ::placeholder { color: #9b9486; }
    button { width: 100%; min-height: 64px; padding: 14px 20px; margin: 8px 0; border: 0; border-radius: 999px; background: var(--soft); color: var(--ink); font-weight: 700; cursor: pointer; touch-action: manipulation; transition: transform .06s, background .12s; }
    button:active { transform: scale(.985); background: #e3d9c2; }
    button:disabled { opacity: .5; }
    button.main { background: var(--ink); color: #fff; }
    button.main:active { background: #2c2a20; }
    button.small { min-height: 52px; font-size: 17px; font-weight: 600; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
    .item { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; }
    .item .nm { flex: 1; min-width: 0; word-break: break-word; font-weight: 600; }
    .item .nm .muted { font-weight: 500; }
    .item button { width: auto; min-width: 104px; min-height: 52px; margin: 0; font-size: 17px; padding: 12px 20px; }
    .stepper { display: flex; align-items: center; gap: 10px; margin: 12px 0; }
    .stepper button { width: 68px; min-height: 68px; margin: 0; font-size: 30px; padding: 0; flex: none; }
    .stepper input { text-align: center; margin: 0; font-size: 30px; font-weight: 800; }
    .done { text-align: center; padding: 22px 6px 10px; }
    .done .tick { width: 84px; height: 84px; margin: 0 auto 8px; border-radius: 50%; background: var(--ok-bg); color: var(--ok); font-size: 46px; line-height: 84px; }
    .done .big { font-size: 26px; font-weight: 800; margin: 10px 0 6px; line-height: 1.2; }
    .err { background: var(--bad-bg); color: var(--bad); font-weight: 700; margin: 12px 0; padding: 13px 16px; border-radius: 16px; font-size: 17px; }
    .foot { margin-top: 18px; text-align: center; color: var(--muted); font-size: 16px; }
    a.loc { color: var(--ink); font-weight: 700; text-decoration-color: var(--yellow); text-decoration-thickness: 3px; text-underline-offset: 3px; }
    a.btn { display: block; text-align: center; text-decoration: none; background: var(--soft); color: var(--ink); padding: 16px; border-radius: 999px; font-weight: 700; margin: 8px 0; }

    @media (min-width: 700px) {
      body { font-size: 20px; }
      .wrap { max-width: 640px; }
      .card { padding: 30px 28px; }
      h2 { font-size: 36px; }
      .brand { padding-top: 32px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <div class="mark" aria-hidden="true">SGF</div>
    <div><b>SGF Inventory System</b><span>Tools, items and supplies</span></div>
  </header>
  <div id="content" class="card">Sandali lang...</div>
  <div id="foot" class="foot"></div>
</div>

  <script>
    const GAS_URL = ((window.APP_CONFIG && window.APP_CONFIG.GAS_URL) || '').trim();
    const params = new URLSearchParams(window.location.search);
    const box = document.getElementById('content');

    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      Object.assign(el, props || {});
      kids.forEach(k => el.append(k));
      return el;
    }

    async function callServer(fn, ...args) {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        redirect: 'follow',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn, args })
      });
      const data = await res.json();
      if (!data.ok && data.rpcError) throw new Error(data.rpcError);
      return data.result;
    }

    // Server messages are in English. Staff always see them in Tagalog, in plain words.
    const MSGS = [
      [/Enter the borrower/i, 'Ilagay muna ang pangalan mo.'],
      [/^Tool not found/i, 'Hindi nahanap ang tool na ito.'],
      [/Set this tool's location first/i, 'Wala pang lokasyon ang tool na ito. Sabihin sa admin.'],
      [/^Already borrowed by (.+)\.$/i, m => 'Hawak na ni ' + m[1] + ' ang tool na ito. I-refresh ang page.'],
      [/Enter where the tool was put back/i, 'Piliin kung saan ibabalik ang tool.'],
      [/not currently borrowed|This tool is not borrowed/i, 'Naisauli na ang tool na ito. I-refresh ang page.'],
      [/already borrowed/i, 'Hawak na ng iba ang tool na ito. I-refresh ang page.'],
      [/^Location not found/i, 'Hindi nahanap ang rack.'],
      [/^Item not found/i, 'Hindi nahanap ang item na ito.'],
      [/is not a consumable/i, 'Hindi ito puwedeng kunin.'],
      [/^Quantity must be/i, 'Ang dami ay dapat buong numero, 1 pataas.'],
      [/^Only 0 /i, 'Ubos na ang stock nito.'],
      [/^Only (\d+) /i, m => 'Ang natitira na lang ay ' + m[1] + '. Bawasan ang kukunin.'],
      [/^Cannot undo/i, 'Hindi na ma-undo ito.'],
      [/^Write the problem/i, 'Isulat muna kung ano ang problema.'],
      [/lock/i, 'Maraming gumagamit ngayon. Subukan ulit.'],
      [/Failed to fetch|NetworkError|Load failed|network/i, 'Walang internet o mahina ang signal. Subukan ulit.']
    ];
    function tl(msg) {
      msg = String(msg || '');
      for (const [re, out] of MSGS) {
        const m = re.exec(msg);
        if (m) return typeof out === 'function' ? out(m) : out;
      }
      return 'May problema. Subukan ulit, o ipaalam sa admin.';
    }

    const CONTACT = ((window.APP_CONFIG && window.APP_CONFIG.ADMIN_CONTACT) || '').trim();
    let about = '';   // what the person was looking at, sent along with a problem report

    // Remember the person's name on this phone only.
    const store = {
      get(k) { try { return localStorage.getItem(k) || ''; } catch (_) { return ''; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
    };

    function button(text, cls, onclick) {
      return h('button', { className: cls || '', textContent: text, onclick: onclick });
    }

    function errorLine(text) {
      const old = box.querySelector('.err');
      if (old) old.remove();
      box.append(h('div', { className: 'err', textContent: text }));
    }

    // Wraps a server call: shows an error if it fails, calls onOk(result) if it works.
    async function run(btn, fn, args, onOk) {
      const label = btn.textContent;
      btn.disabled = true; btn.textContent = 'Sandali lang...';
      try {
        const r = await callServer(fn, ...args);
        if (!r.ok) { btn.disabled = false; btn.textContent = label; errorLine(tl(r.msg)); return; }
        onOk(r);
      } catch (e) {
        btn.disabled = false; btn.textContent = label;
        errorLine(tl(e.message || e));
      }
    }

    // Green "done" screen. undo = { label, fn } runs once, then back() reloads the page content.
    function doneScreen(title, detail, undo, back) {
      box.innerHTML = '';
      const d = h('div', { className: 'done' },
        h('div', { className: 'tick', textContent: '✔' }),
        h('div', { className: 'big', textContent: title }),
        h('div', { className: 'muted', textContent: detail || '' }));
      box.append(d);
      if (undo) {
        box.append(button('Mali? I-undo', '', async function () {
          this.disabled = true;
          try {
            const r = await undo();
            if (!r.ok) { errorLine(tl(r.msg)); this.disabled = false; return; }
            back('Na-undo na.');
          } catch (e) { errorLine(tl(e.message || e)); this.disabled = false; }
        }));
      }
    }

    function note(text) {
      if (text) box.prepend(h('div', { className: 'badge ok', textContent: text }));
    }

    function locLink(name, locId) {
      if (!name) return 'Wala pang lokasyon';
      if (!locId) return name;
      return h('a', { className: 'loc', href: 'view.html?loc=' + encodeURIComponent(locId), textContent: name });
    }

    // ----- Tool: Hiram / Isauli -----
    async function showTool(id, msg) {
      const t = await callServer('getTool', id);
      box.innerHTML = '';
      if (!t.found) { box.textContent = 'Hindi nahanap ang tool na ito.'; return; }
      about = 'Tool: ' + t.name + ' (' + t.id + ')';
      box.append(h('h2', { textContent: t.name }), h('div', { className: 'muted', textContent: t.id }));

      if (!t.location) {
        box.append(h('p', { textContent: 'Wala pang lokasyon ang tool na ito. Sabihin sa admin.' }));
        note(msg);
        return;
      }

      if (t.status !== 'Borrowed') {
        box.append(h('span', { className: 'badge ok', textContent: 'Available' }),
          h('p', {}, 'Nasa: ', locLink(t.location, t.locationId)));
        const nameIn = h('input', { placeholder: 'Pangalan mo', value: store.get('tt_name'), autocomplete: 'name' });
        box.append(h('div', { className: 'muted', textContent: 'Sino ang hihiram?' }), nameIn);
        const go = button('Hiramin', 'main', function () {
          const who = nameIn.value.trim();
          if (!who) { errorLine('Ilagay muna ang pangalan mo.'); return; }
          run(this, 'borrowTool', [t.id, who], () => {
            store.set('tt_name', who);
            doneScreen('Hiniram mo na ang ' + t.name, 'Ibalik sa ' + t.location + ' pagkatapos gamitin.',
              () => callServer('undoBorrow', t.id), m => showTool(id, m));
          });
        });
        box.append(go);
      } else {
        box.append(h('span', { className: 'badge out', textContent: 'Hawak ni ' + t.borrower }));
        const giveBack = (loc, locName) => function () {
          run(this, 'returnTool', [t.id, loc], () => {
            doneScreen('Naibalik na ang ' + t.name, 'Nasa ' + locName + ' na ito.',
              () => callServer('undoReturn', t.id, t.borrower, t.location), m => showTool(id, m));
          });
        };
        box.append(button('Isauli sa ' + t.location, 'main', giveBack(t.locationId || t.location, t.location)));
        const other = button('Ibang rack...', 'small', async function () {
          this.disabled = true;
          try {
            const list = await callServer('listLocations');
            this.remove();
            box.append(h('h3', { textContent: 'Saan mo ilalagay?' }));
            list.forEach(l => box.append(button(l.name, 'small', giveBack(l.id, l.name))));
          } catch (e) { errorLine(tl(e.message || e)); this.disabled = false; }
        });
        box.append(other);
      }
      note(msg);
    }

    // ----- Consumable: Kumuha -----
    function takePanel(it, back) {
      box.innerHTML = '';
      box.append(h('h2', { textContent: it.name }), h('div', { className: 'muted', textContent: 'Natitira: ' + it.qty }));
      let n = 1;
      const qty = h('input', { type: 'number', min: '1', max: String(it.qty), value: '1', inputMode: 'numeric' });
      qty.addEventListener('input', () => { n = parseInt(qty.value, 10) || 0; });
      const bump = d => { n = Math.min(it.qty, Math.max(1, (parseInt(qty.value, 10) || 0) + d)); qty.value = String(n); };
      box.append(h('h3', { textContent: 'Ilan ang kukunin?' }),
        h('div', { className: 'stepper' }, button('-', '', () => bump(-1)), qty, button('+', '', () => bump(1))));
      const who = h('input', { placeholder: 'Pangalan mo (hindi kailangan)', value: store.get('tt_name'), autocomplete: 'name' });
      box.append(who);
      box.append(button('Kunin', 'main', function () {
        const q = parseInt(qty.value, 10);
        if (!(q >= 1) || q > it.qty) { errorLine('Ang dami ay 1 hanggang ' + it.qty + '.'); return; }
        run(this, 'takeConsumable', [it.id, q, who.value.trim()], r => {
          if (who.value.trim()) store.set('tt_name', who.value.trim());
          doneScreen('Kinuha mo ang ' + q + ' ' + it.name, 'Natitira: ' + r.qty + (r.low ? ' (paubos na)' : ''),
            () => callServer('undoTake', it.id, q), m => back(m));
        });
      }));
      box.append(button('Bumalik', 'small', () => back()));
    }

    function itemBadge(it) {
      if (it.type === 'Consumable' && it.min > 0 && it.qty <= it.min) return h('span', { className: 'badge low', textContent: 'Paubos na' });
      return '';
    }

    // ----- Location (rack / bodega) -----
    async function showLocation(raw, msg) {
      const r = await callServer('getLocation', raw);
      box.innerHTML = '';
      if (!r.found) { box.textContent = 'Hindi nahanap ang lokasyon.'; return; }
      about = 'Rack: ' + r.name + ' (' + r.id + ')';
      box.append(h('h2', { textContent: r.name }), h('div', { className: 'muted', textContent: r.id }));

      box.append(h('h3', { textContent: 'Mga gamit (' + r.items.length + ')' }));
      if (!r.items.length) box.append(h('p', { className: 'muted', textContent: 'Walang nakalagay dito.' }));
      r.items.forEach(it => {
        const row = h('div', { className: 'item' },
          h('div', { className: 'nm' }, it.name, h('div', { className: 'muted', textContent: 'Dami: ' + it.qty }), itemBadge(it)));
        if (it.type === 'Consumable') {
          row.append(button('Kumuha', 'main', () => takePanel(it, m => showLocation(raw, m))));
        }
        box.append(row);
      });

      if (r.tools.length) {
        box.append(h('h3', { textContent: 'Mga tool (' + r.tools.length + ')' }));
        r.tools.forEach(t => {
          const st = t.status === 'Borrowed' ? 'Hawak ni ' + t.borrower : 'Available';
          box.append(h('div', { className: 'item' },
            h('div', { className: 'nm' }, t.name, h('div', { className: 'muted', textContent: st })),
            h('a', { className: 'btn', style: 'width:auto;margin:0;padding:12px 16px', href: 'view.html?id=' + encodeURIComponent(t.id), textContent: 'Buksan' })));
        });
      }
      note(msg);
    }

    // ----- Single item QR -----
    async function showItem(id, msg) {
      const it = await callServer('getItem', id);
      box.innerHTML = '';
      if (!it.found) { box.textContent = 'Hindi nahanap ang item na ito.'; return; }
      about = 'Item: ' + it.name + ' (' + it.id + ')';
      box.append(h('h2', { textContent: it.name }), h('div', { className: 'muted', textContent: it.id }),
        h('p', { textContent: 'Dami: ' + it.qty }), itemBadge(it),
        h('p', {}, 'Nasa: ', locLink(it.location, it.locationId)));
      if (it.type === 'Consumable') box.append(button('Kumuha', 'main', () => takePanel(it, m => showItem(id, m))));
      note(msg);
    }

    // ----- Search -----
    async function initSearch() {
      about = 'Search page';
      const d = await callServer('getStock');
      box.innerHTML = '';
      box.append(h('h2', { textContent: 'Hanapin ang gamit' }));
      const q = h('input', { placeholder: 'I-type ang pangalan...', autocomplete: 'off' });
      const out = h('div');
      box.append(q, out);
      const render = () => {
        out.innerHTML = '';
        const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
        if (!words.length) {
          out.append(h('p', { className: 'muted', textContent: d.items.length + ' items at ' + d.tools.length + ' tools. Mag-type para hanapin kung nasaan.' }));
          return;
        }
        const hit = s => words.every(w => s.includes(w));
        const rows = [];
        d.items.forEach(x => { if (hit((x.name + ' ' + x.location + ' ' + x.id).toLowerCase())) rows.push({ t: 'item', x: x }); });
        d.tools.forEach(x => { if (hit((x.name + ' ' + x.location + ' ' + x.id).toLowerCase())) rows.push({ t: 'tool', x: x }); });
        if (!rows.length) { out.append(h('p', { className: 'muted', textContent: 'Walang nahanap.' })); return; }
        rows.slice(0, 50).forEach(r => {
          const x = r.x;
          const tail = r.t === 'item' ? ' - Dami: ' + x.qty : ' - ' + (x.status === 'Borrowed' ? 'hawak ni ' + x.borrower : 'available');
          out.append(h('div', { className: 'item' },
            h('div', { className: 'nm' }, h('strong', { textContent: x.name }),
              h('div', { className: 'muted' }, locLink(x.location, x.locationId), tail))));
        });
        if (rows.length > 50) out.append(h('p', { className: 'muted', textContent: 'Unang 50 lang ang pinapakita. Dagdagan ang tinype.' }));
      };
      q.addEventListener('input', render);
      render();
    }

    // ----- "May problema?" footer and the Ipaalam sa admin form -----
    function renderFoot() {
      const f = document.getElementById('foot');
      f.innerHTML = '';
      f.append(button('May problema? Ipaalam sa admin', 'small', openReport));
      f.append(h('div', { textContent: CONTACT ? 'O tawagan si ' + CONTACT : '' }));
    }

    function openReport() {
      box.innerHTML = '';
      box.append(h('h2', { textContent: 'Ipaalam sa admin' }),
        h('div', { className: 'muted', textContent: about ? 'Tungkol sa: ' + about : '' }));
      const msg = h('textarea', { placeholder: 'Ano ang problema? (halimbawa: sira ang tool, mali ang dami, may nawawala)', maxLength: 500 });
      const who = h('input', { placeholder: 'Pangalan mo', value: store.get('tt_name'), autocomplete: 'name' });
      box.append(msg, who);
      box.append(button('Ipadala', 'main', function () {
        if (!msg.value.trim()) { errorLine('Isulat muna kung ano ang problema.'); return; }
        run(this, 'reportProblem', [msg.value.trim(), who.value.trim(), about], () => {
          if (who.value.trim()) store.set('tt_name', who.value.trim());
          box.innerHTML = '';
          box.append(h('div', { className: 'done' },
            h('div', { className: 'tick', textContent: '\u2714' }),
            h('div', { className: 'big', textContent: 'Naipadala na' }),
            h('div', { className: 'muted', textContent: 'Salamat! Makikita ito ng admin.' })),
            button('Bumalik', 'small', () => location.reload()));
        });
      }));
      box.append(button('Bumalik', 'small', () => location.reload()));
    }

    async function init() {
      renderFoot();
      if (!GAS_URL || GAS_URL.includes('PASTE_YOUR')) {
        box.textContent = 'Hindi pa naka-set ang backend URL sa config.js.';
        return;
      }
      try {
        if (params.get('loc')) await showLocation(params.get('loc'));
        else if (params.get('item')) await showItem(params.get('item'));
        else if (params.has('search')) await initSearch();
        else if (params.get('id')) await showTool(params.get('id'));
        else box.textContent = 'Mag-scan ng QR code ng tool, rack o item.';
      } catch (err) {
        box.textContent = tl(err.message || err);
        renderFoot();
      }
    }

    init();
  </script>
</body>
</html>
